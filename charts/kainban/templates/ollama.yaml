{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kainban.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kainban.ollama.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The model volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kainban.ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kainban.ollama.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          # Serve, then pull the configured models (already present ones
          # only get their manifest checked), and stop the server on TERM.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              pid=$!
              trap 'kill -TERM $pid' TERM INT
              until ollama list >/dev/null 2>&1; do sleep 1; done
              for m in $KAINBAN_OLLAMA_MODELS; do
                echo "pulling $m"
                ollama pull "$m" || echo "pulling $m failed"
              done
              wait $pid
          env:
            - name: HOME
              value: /data
            - name: OLLAMA_MODELS
              value: /data/models
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.keepAlive | quote }}
            - name: OLLAMA_MAX_LOADED_MODELS
              value: {{ .Values.ollama.maxLoadedModels | quote }}
            - name: KAINBAN_OLLAMA_MODELS
              value: {{ join " " .Values.ollama.models | quote }}
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.ollama.persistence.existingClaim | default (printf "%s-ollama" (include "kainban.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kainban.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kainban.ollama.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kainban.ollama.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
{{- if and .Values.ollama.persistence.enabled (not .Values.ollama.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kainban.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kainban.ollama.labels" . | nindent 4 }}
  annotations:
    # Keep the downloaded models when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.ollama.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size | quote }}
{{- end }}
{{- end }}
