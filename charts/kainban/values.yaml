# Default values for kainban.

# The image is published multi-arch (linux/amd64 + linux/arm64), so the pod
# can be scheduled on any node of a mixed-architecture cluster without a
# nodeSelector on kubernetes.io/arch.
image:
  repository: ghcr.io/zerosuxx/kainban
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a ServiceAccount for the orchestrator.
  create: true
  # Name to use; generated from the fullname when empty.
  name: ""
  annotations: {}

rbac:
  # Create a Role/RoleBinding granting secrets get/list/watch/create/update/patch
  # (no delete) in the release namespace. kainban stores credentials there.
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Extra environment variables for the kainban container, e.g.
#   - name: KAINBAN_LOG_LEVEL
#     value: debug
extraEnv: []

# Size limit of the emptyDir mounted at /tmp.
tmp:
  sizeLimit: 1Gi

# Optional persistent state at /home/ubuntu/.local/state/kainban.
# Credentials themselves always live in Secrets; this only keeps local state
# across pod restarts.
persistence:
  enabled: false
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

agents:
  # --model for the Antigravity CLI (agy). The Gemini API free tier has no
  # quota for the Pro models, so the default is a Flash model; set "" to use
  # agy's own default (gemini-3.1-pro) with a billed Gemini API key.
  antigravityModel: gemini-3.8-flash-medium

# A local Ollama server in the release namespace (Deployment + Service +
# PVC). It pulls `models` on start; the orchestrator and the agent pods get
# its URL as OLLAMA_HOST. CPU only: a 3B model needs ~3 GB of memory.
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: "0.40.1"
    pullPolicy: IfNotPresent
  # Pulled on every start (present models are only checked). llama3.2:3b is
  # ~2 GB; llama3.2:1b (~1.3 GB) for small nodes, llama3.1:8b (~4.9 GB) for
  # better answers.
  models:
    - llama3.2:3b
  # How long a model stays loaded after its last request.
  keepAlive: 30m
  # Models in memory at once; a request for another one unloads the idle
  # one first. Raise it only if the memory limit fits them all.
  maxLoadedModels: 1
  resources:
    requests:
      cpu: 500m
      memory: 3Gi
    limits:
      memory: 6Gi
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 10Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
