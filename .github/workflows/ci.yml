name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/kainban

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint charts/kainban

      - name: helm template
        run: |
          helm template kainban charts/kainban --namespace kainban > /dev/null
          helm template kainban charts/kainban --namespace kainban \
            --set persistence.enabled=true > /dev/null

  # Each architecture builds the Nix image (flake.nix) natively on its own
  # runner and pushes it; `merge` stitches them into one manifest list.
  # magic-nix-cache keeps the Nix store paths in the GitHub Actions cache, so
  # unchanged packages are not rebuilt or re-downloaded.
  docker:
    needs: [test, helm]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      packages: write
      id-token: write # magic-nix-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kainban" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      # Full history: the flake's version is its git short rev.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Upstream Nix: magic-nix-cache then uploads what the build produced
      # (the unfree agent CLIs, the Go binary) to the Actions cache through
      # its post-build hook. With Determinate Nix nothing was uploaded and
      # the same derivations were rebuilt on every run.
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build image
        run: nix build .#image -L --out-link stream-image

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # crane (not docker push) checks which layers ghcr already has and
      # uploads only the changed ones; the layers are reproducible, so most
      # are already there. A fresh docker daemon re-uploads all of them.
      - name: Push
        run: |
          ./stream-image > image.tar
          ref=$(nix run --inputs-from . nixpkgs#crane -- push image.tar "$IMAGE:build-${GITHUB_SHA::7}-$ARCH")
          echo "pushed $ref"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${ref#*@sha256:}"
        env:
          ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kainban" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=()
          for d in *; do digests+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
